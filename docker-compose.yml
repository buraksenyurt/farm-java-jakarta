services:

  postgres:
    image: postgres:latest
    container_name: java-town-postgres
    environment:
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: somew0rds
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - java-town-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: java-town-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: scoth@tiger.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - java-town-network

  sonarqube:
    image: sonarqube:community
    container_name: java-town-sonarqube
    restart: unless-stopped
    stop_grace_period: 1h
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - java-town-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: java-town-rabbitmq
    ports:
      - "5672:5672" # AMQP portu
      - "15672:15672" # Yönetim paneli (guest/guest)
    networks:
      - java-town-network

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: java-town-openobserve
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=ComplexPassword123!
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data
    networks:
      - java-town-network

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: java-town-fluent-bit
    volumes:
      - /home/buraks/payara-micro/logs:/var/log/payara:ro
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro
    networks:
      - java-town-network

  mysql:
    image: mysql:9.7
    container_name: java-town-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=RootPass123!
      - MYSQL_DATABASE=gamecatalog
      - MYSQL_USER=gamecatalog_user
      - MYSQL_PASSWORD=GameCatalog123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - java-town-network

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  openobserve_data:
  fluent_bit_data:
  mysql_data:

networks:
  java-town-network:
    driver: bridge
