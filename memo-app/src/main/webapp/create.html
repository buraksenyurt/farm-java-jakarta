<!DOCTYPE html>
<html>

<head>
    <title>Not Oluştur</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">Memo App</a>
            <div class="navbar-nav">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link active" href="create.html">Yeni Not</a>
                <a class="nav-link" href="manage.html">Notları Yönet</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1 class="mb-4" id="pageTitle">Yeni Not Oluştur</h1>

        <div class="card">
            <div class="card-body">
                <form id="memoForm">
                    <input type="hidden" id="id" name="id">

                    <div class="mb-3">
                        <label for="title" class="form-label">Başlık (en fazla 100 karakter)</label>
                        <input type="text" class="form-control" id="title" name="title" maxlength="100" required>
                    </div>

                    <div class="mb-3">
                        <label for="summary" class="form-label">Özet (en fazla 500 karakter)</label>
                        <textarea class="form-control" id="summary" name="summary" maxlength="500" rows="4"
                            required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Kategori</label>
                        <select class="form-select" id="category" name="category" required></select>
                    </div>

                    <div class="mb-3">
                        <label for="link" class="form-label">Referans Link (opsiyonel)</label>
                        <input type="text" class="form-control" id="link" name="link" placeholder="https://...">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Kaydet</button>
                        <a href="manage.html" class="btn btn-outline-secondary">Vazgeç</a>
                    </div>

                    <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                </form>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script>
        const categorySelect = document.getElementById("category");
        Object.entries(CATEGORY_LABELS).forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            categorySelect.appendChild(option);
        });

        const editingId = new URLSearchParams(window.location.search).get("id");

        async function loadMemoForEdit(id) {
            const response = await fetch(`api/v1/memo/${id}`);
            if (!response.ok) {
                showError("Not bulunamadı.");
                return;
            }
            const memo = await response.json();

            document.getElementById("id").value = memo.id;
            document.getElementById("title").value = memo.title;
            document.getElementById("summary").value = memo.summary;
            document.getElementById("category").value = memo.category;
            document.getElementById("link").value = memo.link ?? "";

            document.getElementById("pageTitle").textContent = "Notu Düzenle";
            document.getElementById("submitBtn").textContent = "Güncelle";
        }

        function showError(message) {
            const errorEl = document.getElementById("errorMessage");
            errorEl.textContent = message;
            errorEl.classList.remove("d-none");
        }

        if (editingId) {
            loadMemoForEdit(editingId);
        }

        document.getElementById("memoForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const memo = {
                title: document.getElementById("title").value,
                summary: document.getElementById("summary").value,
                category: document.getElementById("category").value,
                link: document.getElementById("link").value || null
            };

            const isEditing = Boolean(editingId);
            if (isEditing) {
                memo.id = Number(editingId);
            }

            const response = await fetch(isEditing ? "api/v1/memo/update" : "api/v1/memo/new", {
                method: isEditing ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(memo)
            });

            if (!response.ok) {
                showError(`İşlem başarısız oldu (HTTP ${response.status}). Alanları kontrol edin.`);
                return;
            }

            window.location.href = "manage.html";
        });
    </script>
</body>

</html>
