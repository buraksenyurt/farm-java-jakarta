<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">Memo App</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="dashboard.html">Dashboard</a>
                <a class="nav-link" href="create.html">Yeni Not</a>
                <a class="nav-link" href="manage.html">Notları Yönet</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1 class="mb-4">Dashboard</h1>

        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h5 card-title">Günün Notu</h2>
                <div id="memoOfTheDay">Yükleniyor...</div>
                <button id="refreshMemoBtn" class="btn btn-outline-secondary mt-3">Başka Bir Not Getir</button>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h5 card-title mb-3">İstatistikler</h2>
                <div id="stats" class="row g-3">Yükleniyor...</div>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script>
        async function loadMemoOfTheDay() {
            const container = document.getElementById("memoOfTheDay");
            container.textContent = "Yükleniyor...";

            const response = await fetch("api/v1/memo/random");

            if (response.status === 204) {
                container.innerHTML = '<p class="text-muted fst-italic mb-0">Henüz hiç not eklenmemiş. '
                    + '<a href="create.html">İlk notunu oluştur</a>.</p>';
                return;
            }

            if (!response.ok) {
                container.innerHTML = '<div class="alert alert-danger mb-0">Not yüklenemedi.</div>';
                return;
            }

            const memo = await response.json();
            container.innerHTML = `
                <span class="badge text-bg-secondary">${escapeHtml(CATEGORY_LABELS[memo.category] ?? memo.category)}</span>
                <h3 class="h5 mt-2">${escapeHtml(memo.title)}</h3>
                <p class="mb-1">${escapeHtml(memo.summary)}</p>
                ${memo.link ? `<a href="${escapeHtml(memo.link)}" target="_blank" rel="noopener">${escapeHtml(memo.link)}</a>` : ""}
            `;
        }

        async function loadStats() {
            const container = document.getElementById("stats");
            const response = await fetch("api/v1/memo/stats");

            if (!response.ok) {
                container.innerHTML = '<div class="alert alert-danger mb-0">İstatistikler yüklenemedi.</div>';
                return;
            }

            const stats = await response.json();

            const categoryBoxes = stats.byCategory.map(entry => `
                <div class="col-auto">
                    <div class="card bg-primary-subtle text-center" style="min-width: 140px;">
                        <div class="card-body py-2">
                            <div class="fs-4 fw-bold">${entry.total}</div>
                            <div class="small text-muted">${escapeHtml(CATEGORY_LABELS[entry.category] ?? entry.category)}</div>
                        </div>
                    </div>
                </div>
            `).join("");

            container.innerHTML = `
                <div class="col-auto">
                    <div class="card bg-primary-subtle text-center" style="min-width: 140px;">
                        <div class="card-body py-2">
                            <div class="fs-4 fw-bold">${stats.total}</div>
                            <div class="small text-muted">Toplam Not</div>
                        </div>
                    </div>
                </div>
                ${categoryBoxes}
            `;
        }

        document.getElementById("refreshMemoBtn").addEventListener("click", loadMemoOfTheDay);

        loadMemoOfTheDay();
        loadStats();
    </script>
</body>

</html>
