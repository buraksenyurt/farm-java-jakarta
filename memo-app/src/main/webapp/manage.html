<!DOCTYPE html>
<html>

<head>
    <title>Notları Yönet</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">Memo App</a>
            <div class="navbar-nav">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link" href="create.html">Yeni Not</a>
                <a class="nav-link active" href="manage.html">Notları Yönet</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1 class="mb-4">Notları Yönet</h1>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr id="headerRow"></tr>
                    </thead>
                    <tbody id="memoRows">
                        <tr>
                            <td colspan="4">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script>
        const SORTABLE_COLUMNS = [
            { field: "title", label: "Başlık" },
            { field: "category", label: "Kategori" },
            { field: "dateCreated", label: "Tarih" }
        ];

        const params = new URLSearchParams(window.location.search);
        const currentSortBy = params.get("sortBy") || "dateCreated";
        const currentDirection = (params.get("direction") || "desc").toLowerCase();

        function renderHeader() {
            const headerRow = document.getElementById("headerRow");
            const headerCells = SORTABLE_COLUMNS.map(column => {
                const isActive = column.field === currentSortBy;
                const nextDirection = isActive && currentDirection === "asc" ? "desc" : "asc";
                const arrow = isActive ? (currentDirection === "asc" ? " ▲" : " ▼") : "";

                return `<th><a class="text-decoration-none text-dark" `
                    + `href="manage.html?sortBy=${column.field}&direction=${nextDirection}">`
                    + `${column.label}${arrow}</a></th>`;

            }).join("");

            headerRow.innerHTML = headerCells + "<th>İşlemler</th>";
        }

        async function loadMemos() {
            const tbody = document.getElementById("memoRows");
            const response = await fetch(`api/v1/memo/list?sortBy=${currentSortBy}&direction=${currentDirection}`);

            if (!response.ok) {
                tbody.innerHTML = '<tr><td colspan="4"><div class="alert alert-danger mb-0">'
                    + 'Notlar yüklenemedi.</div></td></tr>';
                return;
            }

            const memos = await response.json();

            if (memos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-muted fst-italic">Henüz not eklenmemiş.</td></tr>';
                return;
            }

            tbody.innerHTML = memos.map(memo => `
                <tr>
                    <td>${escapeHtml(memo.title)}</td>
                    <td><span class="badge text-bg-secondary">${escapeHtml(CATEGORY_LABELS[memo.category] ?? memo.category)}</span></td>
                    <td>${escapeHtml(memo.dateCreated)}</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" href="create.html?id=${memo.id}">Düzenle</a>
                        <button class="btn btn-sm btn-outline-danger" data-id="${memo.id}">Sil</button>
                    </td>
                </tr>
            `).join("");

            tbody.querySelectorAll("button[data-id]").forEach(button => {
                button.addEventListener("click", () => deleteMemo(button.dataset.id));
            });
        }

        async function deleteMemo(id) {
            if (!confirm("Bu notu silmek istediğinize emin misiniz?")) {
                return;
            }

            const response = await fetch(`api/v1/memo/${id}`, { method: "DELETE" });
            if (!response.ok) {
                alert("Not silinemedi.");
                return;
            }

            loadMemos();
        }

        renderHeader();
        loadMemos();
    </script>
</body>

</html>
